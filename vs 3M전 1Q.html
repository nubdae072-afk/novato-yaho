<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>야호팀 코칭 영상 분석 - 노바토 감독</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --orange: #FF6B00;
    --orange-light: #FF8C38;
    --orange-dark: #CC5500;
    --bg-primary: #0D0D0D;
    --bg-secondary: #1A1A1A;
    --bg-card: #1F1F1F;
    --bg-sidebar: #111111;
    --text-primary: #F5F5F5;
    --text-secondary: #AAAAAA;
    --text-muted: #666666;
    --border-color: #2A2A2A;
    --shadow: 0 8px 32px rgba(0,0,0,0.5);
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    display: flex;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--orange-dark); border-radius: 2px; }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 300px;
    min-width: 300px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    z-index: 10;
  }

  .sidebar-header {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--border-color);
    background: linear-gradient(135deg, var(--bg-sidebar) 0%, #1a0f0a 100%);
  }

  .sidebar-header .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sidebar-header .logo-icon {
    width: 40px;
    height: 40px;
    background: var(--orange);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    box-shadow: 0 0 20px rgba(255,107,0,0.3);
  }

  .sidebar-header .logo-text h1 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.3;
  }

  .sidebar-header .logo-text span {
    font-size: 11px;
    color: var(--orange);
    font-weight: 500;
    letter-spacing: 1px;
  }

  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
  }

  .slide-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    cursor: pointer;
    transition: var(--transition);
    border-left: 3px solid transparent;
    position: relative;
  }

  .slide-item:hover {
    background: rgba(255,107,0,0.06);
  }

  .slide-item.active {
    background: rgba(255,107,0,0.1);
    border-left-color: var(--orange);
  }

  .slide-item .slide-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    flex-shrink: 0;
    transition: var(--transition);
  }

  .slide-item.active .slide-num {
    background: var(--orange);
    border-color: var(--orange);
    color: #fff;
    box-shadow: 0 0 12px rgba(255,107,0,0.4);
  }

  .slide-item .slide-info {
    flex: 1;
    min-width: 0;
  }

  .slide-item .slide-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: var(--transition);
  }

  .slide-item.active .slide-title {
    color: var(--orange);
  }

  .slide-item .slide-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border-color);
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
  }

  .sidebar-footer .key-hint {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 6px;
  }

  .sidebar-footer .key-hint kbd {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 10px;
    color: var(--text-secondary);
    font-family: inherit;
  }

  /* ===== MAIN ===== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  .main-header {
    padding: 20px 32px 16px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-primary);
  }

  .main-header .title-area h2 {
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .main-header .title-area h2 .play-num {
    color: var(--orange);
  }

  .main-header .title-area p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .main-header .progress-indicator {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .main-header .progress-indicator strong {
    color: var(--orange);
    font-size: 18px;
  }

  /* ===== VIEWER ===== */
  .viewer {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 32px 24px;
    overflow-y: auto;
    gap: 20px;
  }

  /* GIF Container */
  .gif-container {
    position: relative;
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gif-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .gif-container .gif-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-muted);
  }

  .gif-container .gif-placeholder .icon {
    font-size: 48px;
    opacity: 0.3;
  }

  .gif-container .gif-placeholder p {
    font-size: 14px;
  }

  .gif-container .play-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    color: var(--orange);
    border: 1px solid rgba(255,107,0,0.3);
  }

  /* ===== CARDS ===== */
  .cards-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }

  .card:hover {
    border-color: rgba(255,107,0,0.2);
    transform: translateY(-1px);
  }

  .card.good-play {
    border-left: 3px solid #22C55E;
  }

  .card.tactical-tip {
    border-left: 3px solid #3B82F6;
  }

  .card.coach-voice {
    border-left: 3px solid var(--orange);
  }

  .card-full {
    grid-column: 1 / -1;
  }

  .card .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .card .card-header .card-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .card.good-play .card-icon { background: rgba(34,197,94,0.15); }
  .card.tactical-tip .card-icon { background: rgba(59,130,246,0.15); }
  .card.coach-voice .card-icon { background: rgba(255,107,0,0.15); }

  .card .card-header .card-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .card.good-play .card-label { color: #22C55E; }
  .card.tactical-tip .card-label { color: #3B82F6; }
  .card.coach-voice .card-label { color: var(--orange); }

  .card .card-content {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-primary);
  }

  .card .card-content .player-name {
    display: inline-block;
    font-weight: 700;
    color: var(--orange);
    margin-right: 4px;
  }

  .card .card-content .player-name::after {
    content: '';
    display: inline-block;
    width: 4px;
    height: 4px;
    background: var(--orange);
    border-radius: 50%;
    margin: 0 6px 0 2px;
    vertical-align: middle;
  }

  .card .card-content .highlight {
    color: #FFD700;
    font-weight: 500;
  }

  .card .card-content .critique {
    color: #EF4444;
    font-weight: 500;
  }

  .card .card-content .praise {
    color: #22C55E;
    font-weight: 500;
  }

  /* ===== NAVIGATION CONTROLS ===== */
  .nav-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 12px 0 4px;
  }

  .nav-controls button {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nav-controls button:hover {
    background: var(--orange);
    border-color: var(--orange);
    color: #fff;
    box-shadow: 0 0 20px rgba(255,107,0,0.3);
  }

  .nav-controls button:active {
    transform: scale(0.95);
  }

  .nav-controls .slide-counter {
    font-size: 14px;
    color: var(--text-muted);
    min-width: 80px;
    text-align: center;
  }

  /* ===== KEYBOARD HINT OVERLAY ===== */
  .keyboard-hint {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: var(--text-muted);
    z-index: 100;
    opacity: 0.6;
    transition: var(--transition);
  }

  .keyboard-hint:hover {
    opacity: 1;
  }

  .keyboard-hint .key-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .keyboard-hint kbd {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 10px;
    color: var(--text-secondary);
    font-family: inherit;
  }

  /* ===== MOBILE TOGGLE ===== */
  .mobile-toggle {
    display: none;
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 1000;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    width: 40px;
    height: 40px;
    cursor: pointer;
    color: var(--text-primary);
    font-size: 18px;
    align-items: center;
    justify-content: center;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 1024px) {
    .cards-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 768px) {
    body {
      flex-direction: column;
    }

    .mobile-toggle {
      display: flex;
    }

    .sidebar {
      position: fixed;
      left: -300px;
      top: 0;
      width: 280px;
      min-width: 280px;
      transition: left 0.3s ease;
      box-shadow: 4px 0 20px rgba(0,0,0,0.5);
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 9;
    }

    .sidebar-overlay.active {
      display: block;
    }

    .main-header {
      padding: 16px 16px 12px;
    }

    .main-header .title-area h2 {
      font-size: 16px;
    }

    .viewer {
      padding: 12px 16px 16px;
      gap: 14px;
    }

    .gif-container {
      aspect-ratio: 16/9;
    }

    .cards-grid {
      gap: 12px;
    }

    .card {
      padding: 14px;
    }

    .card .card-content {
      font-size: 13px;
    }

    .nav-controls {
      padding: 8px 0 0;
    }

    .keyboard-hint {
      display: none;
    }

    .sidebar-header {
      padding: 16px 16px 14px;
    }

    .sidebar-header .logo-text h1 {
      font-size: 14px;
    }

    .slide-item {
      padding: 12px 16px;
    }
  }

  @media (max-width: 480px) {
    .main-header .title-area h2 {
      font-size: 14px;
    }

    .main-header .progress-indicator {
      font-size: 12px;
    }

    .main-header .progress-indicator strong {
      font-size: 14px;
    }

    .card .card-content {
      font-size: 12px;
    }

    .nav-controls button {
      width: 38px;
      height: 38px;
      font-size: 15px;
    }
  }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .slide-content {
    animation: fadeIn 0.3s ease;
  }

  /* ===== MOBILE OVERLAY ===== */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 9;
  }

  .sidebar-overlay.active {
    display: block;
  }
</style>
</head>
<body>

<!-- ===== SIDEBAR OVERLAY (mobile) ===== -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ===== MOBILE TOGGLE ===== -->
<button class="mobile-toggle" id="mobileToggle" aria-label="메뉴 열기">
  ☰
</button>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon" onclick="location.href='index.html'" style="cursor:pointer;">🏀</div>
      <div class="logo-text">
        <h1>노바토 야호팀<br>코칭 영상 분석</h1>
        <span>NOVATO YAHO · COACHING FILM</span>
        <div style="margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap;">
          <a href="index.html" style="color: var(--orange); font-size: 11px; text-decoration: none; font-weight: 600;">🏠 홈</a>
          <a href="vs 3M전 3Q.html" style="color: var(--text-muted); font-size: 11px; text-decoration: none;">3Q 분석</a>
        </div>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav" id="sidebarNav">
    <!-- 슬라이드 리스트는 JS로 동적 생성 -->
  </nav>

  <div class="sidebar-footer">
    <div style="margin-bottom: 4px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
      <a href="index.html" style="color: var(--orange); text-decoration: none; font-size: 11px; font-weight: 600;">🏠 홈</a>
      <a href="vs 3M전 3Q.html" style="color: var(--text-muted); text-decoration: none; font-size: 11px;">3Q 분석</a>
    </div>
    <div>방향키 ← → 또는 스페이스바로 슬라이드 이동</div>
    <div class="key-hint">
      <kbd>←</kbd>
      <kbd>→</kbd>
      <kbd>Space</kbd>
    </div>
  </div>
</aside>

<!-- ===== MAIN ===== -->
<main class="main">
  <header class="main-header">
    <div class="title-area">
      <h2>
        <span class="play-num" id="playNum">#1</span>
        <span id="playTitle">넓은 스페이싱과 코너 이동</span>
      </h2>
      <p id="playSub">코칭 포인트: 스페이싱 · 오프더볼 무브 · 토킹</p>
    </div>
    <div class="progress-indicator">
      <strong id="currentSlideNum">1</strong> / <span id="totalSlides">12</span>
    </div>
  </header>

  <div class="viewer" id="viewer">
    <!-- GIF 영역 -->
    <div class="gif-container" id="gifContainer">
      <div class="gif-placeholder" id="gifPlaceholder">
        <div class="icon">🏀</div>
        <p>GIF 파일을 불러오는 중입니다...</p>
      </div>
      <img id="gifImage" style="display:none;" alt="플레이 영상" />
      <div class="play-badge" id="playBadge">🏀 Play #<span id="badgeNum">1</span></div>
    </div>

    <!-- 카드 영역 -->
    <div class="cards-grid" id="cardsContainer">
      <!-- JS로 동적 생성 -->
    </div>

    <!-- 네비게이션 컨트롤 -->
    <div class="nav-controls">
      <button id="prevBtn" aria-label="이전 슬라이드">◀</button>
      <div class="slide-counter">
        <span id="counterCurrent">1</span> / <span id="counterTotal">12</span>
      </div>
      <button id="nextBtn" aria-label="다음 슬라이드">▶</button>
    </div>
  </div>
</main>

<!-- ===== KEYBOARD HINT ===== -->
<div class="keyboard-hint">
  <span class="key-group"><kbd>←</kbd> 이전</span>
  <span class="key-group"><kbd>→</kbd> <kbd>Space</kbd> 다음</span>
</div>

<script>
  // ===== 슬라이드 데이터 =====
  const slides = [
    {
      id: 1,
      title: '넓은 스페이싱과 코너 이동',
      sub: '스페이싱 · 오프더볼 무브',
      gif: './1.gif',
      cards: [
        {
          type: 'good-play',
          icon: '✅',
          label: 'Good Play',
          content: '<span class="player-name">심준</span>페인트존 반대편 공간을 넓게 비워두고 서있어서 <span class="praise">좋았음!</span>'
        },
        {
          type: 'good-play',
          icon: '✅',
          label: 'Good Play',
          content: '<span class="player-name">정교형</span>외곽으로 넓게 벌려서서 훌륭한 스페이싱을 해줌. <span class="praise">이게 바로 스페이싱이다!</span>'
        },
        {
          type: 'tactical-tip',
          icon: '💡',
          label: 'Tactical Tip',
          content: '<span class="player-name">세영</span>현재 위치가 애매해. 정현이 스크린 받고 <span class="highlight">코너 깊숙이 들어가서</span> 공간을 더 넓혀주자. 코너는 금이다!'
        }
      ]
    },
    {
      id: 2,
      title: '리턴 패스 대기 및 동선 겹침',
      sub: '패스 후 무브 · 동선 관리',
      gif: './2.gif',
      cards: [
        {
          type: 'tactical-tip',
          icon: '💡',
          label: 'Tactical Tip',
          content: '<span class="player-name">정교형</span>안쪽으로 킬패스 찔러준 후 구경만 하지말고, 수비가 안으로 쏠리면 <span class="highlight">외곽에서 리턴 패스 받아 3점 던질 준비</span>를 해야함. 패스하고 멈추지마!'
        },
        {
          type: 'coach-voice',
          icon: '🔥',
          label: "Coach's Voice",
          content: '<span class="player-name">세영</span> <span class="player-name">정현</span>또 동선이 겹쳤다! 😤 <span class="critique">이건 용납할 수 없는 실수</span>야. 세영이는 코너 3점 라인에서 대기하는게 훨씬 좋은 선택이 될거야. 동선 겹치면 공간만 좁아져!'
        }
      ]
    },
    {
      id: 3,
      title: '속공 판단과 가상 스크린',
      sub: '트랜지션 · 속공 선택지',
      gif: './3.gif',
      cards: [
        {
          type: 'coach-voice',

  // ===== 상태 =====
  let currentSlide = 0;
  const totalSlides = slides.length;

  // ===== DOM 요소 =====
  const sidebar = document.getElementById('sidebar');
  const sidebarNav = document.getElementById('sidebarNav');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const mobileToggle = document.getElementById('mobileToggle');
  const gifImage = document.getElementById('gifImage');
  const gifPlaceholder = document.getElementById('gifPlaceholder');
  const badgeNum = document.getElementById('badgeNum');
  const playBadge = document.getElementById('playBadge');
  const playNum = document.getElementById('playNum');
  const playTitle = document.getElementById('playTitle');
  const playSub = document.getElementById('playSub');
  const cardsContainer = document.getElementById('cardsContainer');
  const currentSlideNum = document.getElementById('currentSlideNum');
  const totalSlidesEl = document.getElementById('totalSlides');
  const counterCurrent = document.getElementById('counterCurrent');
  const counterTotal = document.getElementById('counterTotal');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  // ===== 사이드바 렌더링 =====
  function renderSidebar() {
    sidebarNav.innerHTML = '';
    slides.forEach((slide, index) => {
      const item = document.createElement('div');
      item.className = 'slide-item' + (index === currentSlide ? ' active' : '');
      item.dataset.index = index;
      item.innerHTML = `
        <div class="slide-num">${slide.id}</div>
        <div class="slide-info">
          <div class="slide-title">${slide.title}</div>
          <div class="slide-sub">${slide.sub}</div>
        </div>
      `;
      item.addEventListener('click', () => {
        goToSlide(index);
        if (window.innerWidth <= 768) closeSidebar();
      });
      sidebarNav.appendChild(item);
    });
  }

  // ===== 슬라이드 이동 =====
  function goToSlide(index) {
    if (index < 0) index = 0;
    if (index >= totalSlides) index = totalSlides - 1;
    if (index === currentSlide) return;

    currentSlide = index;
    const slide = slides[currentSlide];

    // GIF
    const gifSrc = slide.gif;
    if (gifSrc) {
      gifImage.style.display = 'none';
      gifPlaceholder.style.display = 'flex';
      gifPlaceholder.querySelector('p').textContent = 'GIF 파일을 불러오는 중입니다...';
      
      const img = new Image();
      img.onload = function() {
        gifImage.src = gifSrc + '?v=' + slide.id + '&t=' + Date.now();
        gifImage.style.display = 'block';
        gifPlaceholder.style.display = 'none';
      };
      img.onerror = function() {
        gifImage.style.display = 'none';
        gifPlaceholder.style.display = 'flex';
        gifPlaceholder.querySelector('p').textContent = 'GIF 파일을 찾을 수 없습니다.';
      };
      img.src = gifSrc + '?v=' + slide.id + '&t=' + Date.now();
      
      // 캐시된 이미지는 onload가 발생하지 않을 수 있으므로 체크
      if (img.complete) {
        gifImage.src = gifSrc + '?v=' + slide.id + '&t=' + Date.now();
        gifImage.style.display = 'block';
        gifPlaceholder.style.display = 'none';
      }
    }

    // 배지
    badgeNum.textContent = slide.id;
    playBadge.style.display = 'flex';

    // 헤더
    playNum.textContent = '#' + slide.id;
    playTitle.textContent = slide.title;
    playSub.textContent = '코칭 포인트: ' + slide.sub;

    // 진행률
    currentSlideNum.textContent = slide.id;
    counterCurrent.textContent = slide.id;

    // 카드
    renderCards(slide.cards);

    // 사이드바 업데이트
    document.querySelectorAll('.slide-item').forEach((el, i) => {
      el.classList.toggle('active', i === currentSlide);
      // 활성화된 항목이 보이도록 스크롤
      if (i === currentSlide) {
        el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });
  }

  // ===== 카드 렌더링 =====
  function renderCards(cards) {
    cardsContainer.innerHTML = '';
    // 모든 카드의 개수에 따라 그리드 조정
    if (cards.length === 1) {
      cardsContainer.style.gridTemplateColumns = '1fr';
    } else if (cards.length === 2) {
      cardsContainer.style.gridTemplateColumns = '1fr 1fr';
    } else {
      cardsContainer.style.gridTemplateColumns = '1fr 1fr';
    }

    cards.forEach((card, index) => {
      const cardEl = document.createElement('div');
      cardEl.className = `card ${card.type}`;
      if (cards.length === 3 && index === 2) {
        cardEl.classList.add('card-full');
      }
      cardEl.innerHTML = `
        <div class="card-header">
          <div class="card-icon">${card.icon}</div>
          <div class="card-label">${card.label}</div>
        </div>
        <div class="card-content">${card.content}</div>
      `;
      cardsContainer.appendChild(cardEl);
    });
  }

  // ===== 사이드바 토글 (모바일) =====
  function toggleSidebar() {
    sidebar.classList.toggle('open');
    sidebarOverlay.classList.toggle('active');
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('active');
  }

  mobileToggle.addEventListener('click', toggleSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);

  // ===== 키보드 이벤트 =====
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault();
      if (currentSlide < totalSlides - 1) goToSlide(currentSlide + 1);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      if (currentSlide > 0) goToSlide(currentSlide - 1);
    }
  });

  // ===== 버튼 이벤트 =====
  prevBtn.addEventListener('click', () => {
    if (currentSlide > 0) goToSlide(currentSlide - 1);
  });

  nextBtn.addEventListener('click', () => {
    if (currentSlide < totalSlides - 1) goToSlide(currentSlide + 1);
  });

  // ===== 터치 스와이프 =====
  let touchStartX = 0;
  let touchEndX = 0;

  document.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
  }, { passive: true });

  function handleSwipe() {
    const threshold = 60;
    const diff = touchStartX - touchEndX;
    if (Math.abs(diff) > threshold) {
      if (diff > 0 && currentSlide < totalSlides - 1) {
        goToSlide(currentSlide + 1);
      } else if (diff < 0 && currentSlide > 0) {
        goToSlide(currentSlide - 1);
      }
    }
  }

  // ===== 초기화 =====
  totalSlidesEl.textContent = totalSlides;
  counterTotal.textContent = totalSlides;
  renderSidebar();
  goToSlide(0);
</script>
