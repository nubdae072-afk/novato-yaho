<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3쿼터 분석 - 야호팀 vs 3M (노바토 감독)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --orange: #FF6B00;
    --orange-light: #FF8C38;
    --orange-dark: #CC5500;
    --bg-primary: #0D0D0D;
    --bg-secondary: #1A1A1A;
    --bg-card: #1F1F1F;
    --bg-sidebar: #111111;
    --text-primary: #F5F5F5;
    --text-secondary: #AAAAAA;
    --text-muted: #666666;
    --border-color: #2A2A2A;
    --shadow: 0 8px 32px rgba(0,0,0,0.5);
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    display: flex;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--orange-dark); border-radius: 2px; }

  .sidebar {
    width: 300px;
    min-width: 300px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    z-index: 10;
  }

  .sidebar-header {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--border-color);
    background: linear-gradient(135deg, var(--bg-sidebar) 0%, #1a0f0a 100%);
  }

  .sidebar-header .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sidebar-header .logo-icon {
    width: 40px;
    height: 40px;
    background: var(--orange);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    box-shadow: 0 0 20px rgba(255,107,0,0.3);
  }

  .sidebar-header .logo-text h1 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.3;
  }

  .sidebar-header .logo-text span {
    font-size: 11px;
    color: var(--orange);
    font-weight: 500;
    letter-spacing: 1px;
  }

  .sidebar-header .badge-q {
    display: inline-block;
    background: var(--orange);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    margin-top: 4px;
  }

  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
  }

  .slide-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    cursor: pointer;
    transition: var(--transition);
    border-left: 3px solid transparent;
    position: relative;
  }

  .slide-item:hover {
    background: rgba(255,107,0,0.06);
  }

  .slide-item.active {
    background: rgba(255,107,0,0.1);
    border-left-color: var(--orange);
  }

  .slide-item .slide-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    flex-shrink: 0;
    transition: var(--transition);
  }

  .slide-item.active .slide-num {
    background: var(--orange);
    border-color: var(--orange);
    color: #fff;
    box-shadow: 0 0 12px rgba(255,107,0,0.4);
  }

  .slide-item .slide-info {
    flex: 1;
    min-width: 0;
  }

  .slide-item .slide-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: var(--transition);
  }

  .slide-item.active .slide-title {
    color: var(--orange);
  }

  .slide-item .slide-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border-color);
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
  }

  .sidebar-footer .key-hint {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 6px;
  }

  .sidebar-footer .key-hint kbd {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 10px;
    color: var(--text-secondary);
    font-family: inherit;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  .main-header {
    padding: 20px 32px 16px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-primary);
  }

  .main-header .title-area h2 {
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .main-header .title-area h2 .play-num {
    color: var(--orange);
  }

  .main-header .title-area p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .main-header .progress-indicator {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .main-header .progress-indicator strong {
    color: var(--orange);
    font-size: 18px;
  }

  .viewer {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 32px 24px;
    overflow-y: auto;
    gap: 20px;
  }

  .gif-container {
    position: relative;
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gif-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .gif-container .gif-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-muted);
  }

  .gif-container .gif-placeholder .icon {
    font-size: 48px;
    opacity: 0.3;
  }

  .gif-container .gif-placeholder p {
    font-size: 14px;
  }

  .gif-container .play-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    color: var(--orange);
    border: 1px solid rgba(255,107,0,0.3);
  }

  .cards-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }

  .card:hover {
    border-color: rgba(255,107,0,0.2);
    transform: translateY(-1px);
  }

  .card.good-play {
    border-left: 3px solid #22C55E;
  }

  .card.tactical-tip {
    border-left: 3px solid #3B82F6;
  }

  .card.coach-voice {
    border-left: 3px solid var(--orange);
  }

  .card.defense {
    border-left: 3px solid #A855F7;
  }

  .card-full {
    grid-column: 1 / -1;
  }

  .card .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .card .card-header .card-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .card.good-play .card-icon { background: rgba(34,197,94,0.15); }
  .card.tactical-tip .card-icon { background: rgba(59,130,246,0.15); }
  .card.coach-voice .card-icon { background: rgba(255,107,0,0.15); }
  .card.defense .card-icon { background: rgba(168,85,247,0.15); }

  .card .card-header .card-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .card.good-play .card-label { color: #22C55E; }
  .card.tactical-tip .card-label { color: #3B82F6; }
  .card.coach-voice .card-label { color: var(--orange); }
  .card.defense .card-label { color: #A855F7; }

  .card .card-content {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-primary);
  }

  .card .card-content .player-name {
    display: inline-block;
    font-weight: 700;
    color: var(--orange);
    margin-right: 4px;
  }

  .card .card-content .player-name::after {
    content: '';
    display: inline-block;
    width: 4px;
    height: 4px;
    background: var(--orange);
    border-radius: 50%;
    margin: 0 6px 0 2px;
    vertical-align: middle;
  }

  .card .card-content .highlight {
    color: #FFD700;
    font-weight: 500;
  }

  .card .card-content .critique {
    color: #EF4444;
    font-weight: 500;
  }

  .card .card-content .praise {
    color: #22C55E;
    font-weight: 500;
  }

  .nav-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 12px 0 4px;
  }

  .nav-controls button {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nav-controls button:hover {
    background: var(--orange);
    border-color: var(--orange);
    color: #fff;
    box-shadow: 0 0 20px rgba(255,107,0,0.3);
  }

  .nav-controls button:active {
    transform: scale(0.95);
  }

  .nav-controls .slide-counter {
    font-size: 14px;
    color: var(--text-muted);
    min-width: 80px;
    text-align: center;
  }

  .keyboard-hint {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: var(--text-muted);
    z-index: 100;
    opacity: 0.6;
    transition: var(--transition);
  }

  .keyboard-hint:hover {
    opacity: 1;
  }

  .keyboard-hint .key-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .keyboard-hint kbd {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 10px;
    color: var(--text-secondary);
    font-family: inherit;
  }

  .mobile-toggle {
    display: none;
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 1000;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    width: 40px;
    height: 40px;
    cursor: pointer;
    color: var(--text-primary);
    font-size: 18px;
    align-items: center;
    justify-content: center;
  }

  @media (max-width: 1024px) {
    .cards-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 768px) {
    body {
      flex-direction: column;
    }

    .mobile-toggle {
      display: flex;
    }

    .sidebar {
      position: fixed;
      left: -300px;
      top: 0;
      width: 280px;
      min-width: 280px;
      transition: left 0.3s ease;
      box-shadow: 4px 0 20px rgba(0,0,0,0.5);
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 9;
    }

    .sidebar-overlay.active {
      display: block;
    }

    .main-header {
      padding: 16px 16px 12px;
    }

    .main-header .title-area h2 {
      font-size: 16px;
    }

    .viewer {
      padding: 12px 16px 16px;
      gap: 14px;
    }

    .gif-container {
      aspect-ratio: 16/9;
    }

    .cards-grid {
      gap: 12px;
    }

    .card {
      padding: 14px;
    }

    .card .card-content {
      font-size: 13px;
    }

    .nav-controls {
      padding: 8px 0 0;
    }

    .keyboard-hint {
      display: none;
    }

    .sidebar-header {
      padding: 16px 16px 14px;
    }

    .sidebar-header .logo-text h1 {
      font-size: 14px;
    }

    .slide-item {
      padding: 12px 16px;
    }
  }

  @media (max-width: 480px) {
    .main-header .title-area h2 {
      font-size: 14px;
    }

    .main-header .progress-indicator {
      font-size: 12px;
    }

    .main-header .progress-indicator strong {
      font-size: 14px;
    }

    .card .card-content {
      font-size: 12px;
    }

    .nav-controls button {
      width: 38px;
      height: 38px;
      font-size: 15px;
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .slide-content {
    animation: fadeIn 0.3s ease;
  }

  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 9;
  }

  .sidebar-overlay.active {
    display: block;
  }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<button class="mobile-toggle" id="mobileToggle" aria-label="메뉴 열기">☰</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon" onclick="location.href='index.html'" style="cursor:pointer;">🏀</div>
      <div class="logo-text">
        <h1>노바토 야호팀<br>vs 3M · 3쿼터 분석</h1>
        <span>NOVATO YAHO · 3Q COACHING FILM</span>
        <div class="badge-q">3쿼터 · 스페이싱 & 수비 집중</div>
        <div style="margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap;">
          <a href="index.html" style="color: var(--orange); font-size: 11px; text-decoration: none; font-weight: 600;">🏠 홈</a>
          <a href="vs 3M전 1Q.html" style="color: var(--text-muted); font-size: 11px; text-decoration: none;">1Q 분석</a>
        </div>
      </div>
    </div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer">
    <div style="margin-bottom: 4px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
      <a href="index.html" style="color: var(--orange); text-decoration: none; font-size: 11px; font-weight: 600;">🏠 홈</a>
      <a href="vs 3M전 1Q.html" style="color: var(--text-muted); text-decoration: none; font-size: 11px;">1Q 분석</a>
    </div>
    <div>방향키 ← → 또는 스페이스바로 이동</div>
    <div class="key-hint">
      <kbd>←</kbd>
      <kbd>→</kbd>
      <kbd>Space</kbd>
    </div>
  </div>
</aside>

<main class="main">
  <header class="main-header">
    <div class="title-area">
      <h2>
        <span class="play-num" id="playNum">#1</span>
        <span id="playTitle">혼(Horn) 공격 수비 대응</span>
      </h2>
      <p id="playSub">공격: 스페이싱 · 수비: 스크린 대처</p>
    </div>
    <div class="progress-indicator">
      <strong id="currentSlideNum">1</strong> / <span id="totalSlides">17</span>
    </div>
  </header>

  <div class="viewer" id="viewer">
    <div class="gif-container" id="gifContainer">
      <div class="gif-placeholder" id="gifPlaceholder">
        <div class="icon">🏀</div>
        <p>GIF 파일을 불러오는 중입니다...</p>
      </div>
      <img id="gifImage" style="display:none;" alt="플레이 영상" />
      <div class="play-badge">🏀 Play #<span id="badgeNum">1</span></div>
    </div>

    <div class="cards-grid" id="cardsContainer"></div>

    <div class="nav-controls">
      <button id="prevBtn" aria-label="이전">◀</button>
      <div class="slide-counter">
        <span id="counterCurrent">1</span> / <span id="counterTotal">17</span>
      </div>
      <button id="nextBtn" aria-label="다음">▶</button>
    </div>
  </div>
</main>

<div class="keyboard-hint">
  <span class="key-group"><kbd>←</kbd> 이전</span>
  <span class="key-group"><kbd>→</kbd> <kbd>Space</kbd> 다음</span>
</div>

<script>
  const slides = [
    {
      id: 1,
      title: '혼(Horn) 공격 수비 대응',
      sub: '맨수비 · 스크린 대처',
      gif: './3q/1.gif',
      cards: [
        {
          type: 'tactical-tip',
          icon: '💡',
          label: 'Tactical Tip',
          content: '상대편 <span class="highlight">혼(Horn) 공격</span> 좌우 동시에 움직이는 타이밍이 좋다. 저런 움직임을 우리도 배우자! 두 명이 동시에 움직이면 수비가 혼란스러워진다.'
        },
        {
          type: 'defense',
          icon: '🛡️',
          label: 'Defense',
          content: '<span class="player-name">권재영</span>이게 혼(Horn) 공격이야. 스크린 걸리지 않고 <span class="highlight">수비하는 연습</span>을 하자. 상대 혼 움직임을 읽고 선제적으로 대응해야 해!'
        }
      ]
    },
    {
      id: 2,
      title: '컷인 방향 선택',
      sub: '스페이싱 · 컷인 타이밍',
      gif: './3q/3.gif',
      cards: [
        {
          type: 'tactical-tip',
          icon: '💡',
          label: 'Tactical Tip',
          content: '<span class="player-name">권재영</span>컷인할 때 양쪽 로우(로우포스트)에 우리편이 차있으면 <span class="highlight">하이(하이포스트) 쪽으로 가자</span>. 좁은 공간으로 들어가면 스페이싱만 죽어!'
        }
      ]
    },
    {
      id: 3,
      title: '수비 스크린 대처',
      sub: '맨수비 · 스크린 읽기',
      gif: './3q/4.gif',
      cards: [
        {
          type: 'defense',
          icon: '🛡️',
          label: 'Defense',
          content: '<span class="player-name">김민철</span>수비 스크린한테 <span class="critique">속았네 ㅋㅋㅋㅋ</span> 😵 스크린 오는 타이밍을 읽고 <span class="highlight">사이드 스텝으로 밀착 수비</span>해야지. 한 번 속으면 두 번은 안 당하자!'
        }
      ]
    },
    {
      id: 4,
      title: '완벽한 코트 발란스',
      sub: '스페이싱 · 코트 발란스',
      gif: './3q/5.gif',
      cards: [
        {
          type: 'good-play',
          icon: '✅',
          label: 'Good Play',
          content: '<span class="player-name">권재영</span>로우에서 스크린 받으면서 하이쪽으로 갔다가 안주니 윙으로 가는 <span class="praise">움직임 굿!</span> 👍'
        },
        {
          type: 'good-play',
          icon: '✅',
          label: 'Good Play',
          content: '<span class="player-name">정교형</span>기다렸다가 하이 투입한 <span class="praise">판단 굿!</span> 👍'
        },
        {
          type: 'tactical-tip',

  let currentSlide = 0;
  const totalSlides = slides.length;

  const sidebar = document.getElementById('sidebar');
  const sidebarNav = document.getElementById('sidebarNav');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const mobileToggle = document.getElementById('mobileToggle');
  const gifImage = document.getElementById('gifImage');
  const gifPlaceholder = document.getElementById('gifPlaceholder');
  const badgeNum = document.getElementById('badgeNum');
  const playNum = document.getElementById('playNum');
  const playTitle = document.getElementById('playTitle');
  const playSub = document.getElementById('playSub');
  const cardsContainer = document.getElementById('cardsContainer');
  const currentSlideNum = document.getElementById('currentSlideNum');
  const totalSlidesEl = document.getElementById('totalSlides');
  const counterCurrent = document.getElementById('counterCurrent');
  const counterTotal = document.getElementById('counterTotal');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function renderSidebar() {
    sidebarNav.innerHTML = '';
    slides.forEach((slide, index) => {
      const item = document.createElement('div');
      item.className = 'slide-item' + (index === currentSlide ? ' active' : '');
      item.dataset.index = index;
      item.innerHTML = `
        <div class="slide-num">${slide.id}</div>
        <div class="slide-info">
          <div class="slide-title">${slide.title}</div>
          <div class="slide-sub">${slide.sub}</div>
        </div>
      `;
      item.addEventListener('click', () => {
        goToSlide(index);
        if (window.innerWidth <= 768) closeSidebar();
      });
      sidebarNav.appendChild(item);
    });
  }

  function goToSlide(index) {
    if (index < 0) index = 0;
    if (index >= totalSlides) index = totalSlides - 1;
    if (index === currentSlide) return;

    currentSlide = index;
    const slide = slides[currentSlide];

    const gifSrc = slide.gif;
    if (gifSrc) {
      gifImage.style.display = 'none';
      gifPlaceholder.style.display = 'flex';
      gifPlaceholder.querySelector('p').textContent = 'GIF 파일을 불러오는 중입니다...';
      
      const img = new Image();
      img.onload = function() {
        gifImage.src = gifSrc + '?v=' + slide.id + '&t=' + Date.now();
        gifImage.style.display = 'block';
        gifPlaceholder.style.display = 'none';
      };
      img.onerror = function() {
        gifImage.style.display = 'none';
        gifPlaceholder.style.display = 'flex';
        gifPlaceholder.querySelector('p').textContent = 'GIF 파일을 찾을 수 없습니다.';
      };
      img.src = gifSrc + '?v=' + slide.id + '&t=' + Date.now();
      
      // 캐시된 이미지는 onload가 발생하지 않을 수 있으므로 체크
      if (img.complete) {
        gifImage.src = gifSrc + '?v=' + slide.id + '&t=' + Date.now();
        gifImage.style.display = 'block';
        gifPlaceholder.style.display = 'none';
      }
    }

    badgeNum.textContent = slide.id;
    playNum.textContent = '#' + slide.id;
    playTitle.textContent = slide.title;
    playSub.textContent = '포인트: ' + slide.sub;

    currentSlideNum.textContent = slide.id;
    counterCurrent.textContent = slide.id;

    renderCards(slide.cards);

    document.querySelectorAll('.slide-item').forEach((el, i) => {
      el.classList.toggle('active', i === currentSlide);
      if (i === currentSlide) {
        el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });
  }

  function renderCards(cards) {
    cardsContainer.innerHTML = '';
    if (cards.length === 1) {
      cardsContainer.style.gridTemplateColumns = '1fr';
    } else if (cards.length === 2) {
      cardsContainer.style.gridTemplateColumns = '1fr 1fr';
    } else {
      cardsContainer.style.gridTemplateColumns = '1fr 1fr';
    }

    cards.forEach((card, index) => {
      const cardEl = document.createElement('div');
      cardEl.className = `card ${card.type}`;
      if (cards.length === 3 && index === 2) {
        cardEl.classList.add('card-full');
      }
      cardEl.innerHTML = `
        <div class="card-header">
          <div class="card-icon">${card.icon}</div>
          <div class="card-label">${card.label}</div>
        </div>
        <div class="card-content">${card.content}</div>
      `;
      cardsContainer.appendChild(cardEl);
    });
  }

  function toggleSidebar() {
    sidebar.classList.toggle('open');
    sidebarOverlay.classList.toggle('active');
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('active');
  }

  mobileToggle.addEventListener('click', toggleSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault();
      if (currentSlide < totalSlides - 1) goToSlide(currentSlide + 1);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      if (currentSlide > 0) goToSlide(currentSlide - 1);
    }
  });

  prevBtn.addEventListener('click', () => {
    if (currentSlide > 0) goToSlide(currentSlide - 1);
  });

  nextBtn.addEventListener('click', () => {
    if (currentSlide < totalSlides - 1) goToSlide(currentSlide + 1);
  });

  let touchStartX = 0;
  let touchEndX = 0;

  document.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
  }, { passive: true });

  function handleSwipe() {
    const threshold = 60;
    const diff = touchStartX - touchEndX;
    if (Math.abs(diff) > threshold) {
      if (diff > 0 && currentSlide < totalSlides - 1) {
        goToSlide(currentSlide + 1);
      } else if (diff < 0 && currentSlide > 0) {
        goToSlide(currentSlide - 1);
      }
    }
  }

  totalSlidesEl.textContent = totalSlides;
  counterTotal.textContent = totalSlides;
  renderSidebar();
  goToSlide(0);
</script>
